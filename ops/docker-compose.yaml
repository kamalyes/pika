version: "3"
services:

  pika_mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: always
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME}
      TZ: Asia/Shanghai
    networks:
      pika_net:
        aliases:
          - pika_mysql

  pika_redis:
    image: redis:${REDIS_VERSION}
    container_name: ${REDIS_CONTAINER_NAME}
    command: redis-server --requirepass ${${REDIS_PASSWORD}}
    restart: always
    ports:
      - ${REDIS_PORT}:6379
    environment:
      - TZ=Asia/Shanghai
    networks:
      pika_net:
        aliases:
          - pika_redis

  pika:
    build:
      context: ../
      dockerfile: ${SERVICE_DOCKERFILE_PATH}
      args:
        buildno: 1
    container_name: ${SERVICE_CONTAINER_NAME}
    ports:
      - ${SERVICE_PORT}:7777
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      pika_net:
        aliases:
          - pika_server
    volumes:
      - ${WORKSPACES_PATH}/.env:/opt/pika/conf/.env

networks:
  pika_net:
