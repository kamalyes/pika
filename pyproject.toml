[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pika"
version = "1.0.0"
description = "Pika是一款专注于自动化建设的平台"
readme = "README.md"
license = "Apache"
authors = ["Kamalyes <mryu168@163.com>",]

repository = "https://github.com/kamalyes/pika"

classifiers = [
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python=">=3.9,<4.0"
python-multipart="~0.0.20"
pydantic = {extras = ["dotenv"], version = "~1.10.24"}
dicttoxml={version="~1.7.16"}
Faker={version="~37.8.0"}
fastapi={version="~0.95.1"}
gunicorn="~23.0.0"
custard={version=">=1.1.7"}
pypinyin="~0.55.0"
cos-python-sdk-v5="~1.9.38"
dictdiffer="~0.9.0"
jsonpath="~0.82"
pyjwt="~2.10.1"
mysql-connector-python="~9.4.0"
loguru="~0.7.3"
requests="~2.32.5"
sqlalchemy="2.0.24"
starlette="~0.26.1"
aioredis="~2.0.1"
aiosqlite="~0.21.0"
mitmproxy="~9.0.1"
uvicorn="~0.37.0"
supervisor="~4.3.0"
typing-extensions="~4.4.0"
PyYAML="~6.0"
aiohttp={version="~3.12.15"}
aiomysql="~0.2.0"
Jinja2="~3.1.6"
APScheduler="3.11.0"
redis="~6.4.0"
redlock="~1.2.0"
oss2="~2.19.1"
awaits="~0.0.12"
qiniu="~7.17.0"
pymysql="~1.1.2"
minio="~7.2.16"
mkdocs="~1.5.3"
mkdocs-material="~9.5.18"
mypy="~1.10.1"
ruff="~0.0.272"

[tool.poetry.dev-dependencies]
pytest="~8.4.2"
pytest-cov="~7.0.0"
pytest-asyncio="~0.25.3"
black="~25.9.0"
pre-commit="~4.3.0"

[tool.poetry.extras]
all = [
    "Faker",
    "pypinyin",
    "cos-python-sdk-v5",
    "typing-extensions",
    "dictdiffer",
    "jsonpath",
    "dicttoxml",
    "gunicorn",
    "pyjwt",
    "oss2",
    "python-multipart",
    "mysql-connector-python",
    "loguru",
    "aiohttp",
    "mitmproxy",
    "awaits",
    "minio",
    "redlock",
    "supervisor",
    "qiniu",
    "pymysql",
    "custard",
    "Jinja2",
    "aiomysql",
    "six",
    "APScheduler",
    "kafka",
    "fastapi",
    "sqlalchemy",
    "uvicorn",
    "pydantic",
    "requests",
    "starlette",
    "aioredis",
    "lxml",
    "redis",
    "mkdocs",
    "certifi",
    "crypto",
    "PyYAML",
    "w3lib"
]
[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"


[tool.poetry.group.dev.dependencies]
autopep8 = "~2.3.2"

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''

[tool.ruff]
line-length = 120
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "G",  # flake8-logging-format
    "PIE", # flake8-pie
    "COM", # flake8-commas
    "PT", # flake8-pytest-style
    "Q",  # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TRY", # tryceratops
    "RUF", # ruff specific rules
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected
    "PT004", # fixture doesn't return anything
    "PT013", # allow from pytest import thing
    "SIM114", # allow have multiplie ifs with same body
    "TRY003", # allow long exc message
    "RUF100", # allow unused noqa
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
]
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
target-version = "py39"

[tool.ruff.mccabe]
max-complexity = 10

[tool.mypy]
python_version = 3.9
strict = true
follow_imports = "normal"
ignore_missing_imports = true
no_implicit_reexport = false
show_column_numbers=true
show_error_codes=true

[tool.coverage.paths]
source = ["pika"]

[tool.coverage.run]
source = ["pika"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "@overload",
    "if TYPE_CHECKING:",
]
