[tool.poetry]
name = "pika"
description = "Pika是一款专注于自动化建设的平台,采用`Python`+`FastApi`+`React`开发,目前还不能作为生产级别的工具,作者正在努力之中。"
authors = ["kamalyes <501893067@qq.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"

classifiers = [
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "starlette>=0.19.1",
    "pydantic >=1.6.2,!=1.7,!=1.7.1,!=1.7.2,!=1.7.3,!=1.8,!=1.8.1,<2.0.0",
]

dev = [
    "ruff ==0.0.138",
    "uvicorn[standard] >=0.12.0,<0.19.0",
    "pre-commit >=2.17.0,<3.0.0",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/kamalyes/pika"

[project.optional-dependencies]
test = [
    "pytest >=7.1.3,<8.0.0",
    "coverage[toml] >= 6.5.0,<7.0",
    "mypy ==0.982",
    "black == 22.10.0",
    "isort >=5.0.6,<6.0.0",
]
doc = [
    "mkdocs >=1.1.2,<2.0.0",
    "mkdocs-material >=8.1.5,<9.0.0",
    "mdx-include >=1.4.1,<2.0.0",
    "mkdocs-markdownextradata-plugin >=0.1.7,<0.3.0",
    "typer[all] >=0.6.1,<0.8.0",
    "pyyaml >=5.3.1,<7.0.0",
]
all = [
      "gunicorn>=20.1.0",
      "custard>=1.1.1",
      "pypinyin>=0.48.0",
      "cos-python-sdk-v5>=1.9.20",
      "dictdiffer>=0.9.0",
      "jsonpath>=0.82",
      "pyjwt>=2.4.0",
      "mysql-connector-python==8.0.26",
      "loguru>=0.6.0",
      "requests>=2.27.0",
      "sqlalchemy>=1.4.39",
      "fastapi",
      "starlette",
      "aioredis>=2.0.1",
      "mitmproxy>=9.0.1",
      "uvicorn[standard]",
      "supervisor>=4.2.5",
      "pydantic>=1.9.0",
      "typing-extensions",
      "PyYAML>=6.0",
      "aiohttp==3.8.1",
      "aiomysql==0.1.1",
      "Jinja2==3.0.3",
      "APScheduler==3.8.0",
      "redis==3.5.3",
      "redlock>=1.2.0",
      "oss2>=2.16.0",
      "awaits>=0.0.1",
      "qiniu>=7.6.0",
      "GitPython>=3.1.30",
      "pymysql>=1.0.2",
      "beautifulsoup4>=4.11.1",
      "dicttoxml>=1.7.16",
      "python-multipart>=0.0.5",
      "lxml>=4.9.0",
      "faker>=17.6.0",
      "minio>=7.1.10"
      ]

[tool.hatch.version]
path = "app/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
