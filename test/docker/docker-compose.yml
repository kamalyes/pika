version: "3"
services:
  pika:
    image: kamalyes/pika:latest
    container_name: pika
    restart: always
    privileged: true
    ports:
      - 7777:7777
      - 7778:7778
      - 9001:9001
    environment:
      - TZ=Asia/Shanghai
      # 数据库配置
    volumes:
      - ./logs:/opt/pika/logs
      - ./.env:/opt/pika/conf/.env
    networks:
      - pika-network

networks:
  pika-network:
    driver: bridge
