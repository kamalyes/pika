version: "3"
services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql
    privileged: true 
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_PWD}"
        ]
      interval: 6s
      timeout: 5s
      retries: 50
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PWD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - ${WORKSPACES_PATH}/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ${WORKSPACES_PATH}/bin/mysql:/docker-entrypoint-initdb.d/
      - ${WORKSPACES_PATH}/data/mysql:/var/lib/mysql
    networks:
      pika-network:
        aliases:
          - pika-mysql

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    privileged: true 
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 6s
      timeout: 5s
      retries: 50
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ${WORKSPACES_PATH}/conf/redis.conf:/etc/redis/redis.conf
      - ${WORKSPACES_PATH}/data/redis:/data
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      pika-network:
        aliases:
          - pika-redis

  pika:
    image: kamalyes/pika-testing:latest
    container_name: pika
    restart: always
    privileged: true 
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${WORKSPACES_PATH}/conf:/opt/pika/conf
      - ${WORKSPACES_PATH}/logs:/opt/pika/logs
    networks:
      pika-network:
        aliases:
          - pika_server
      
networks:
  pika-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${PIKA_DOCKER_SUBNET}