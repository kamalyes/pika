debug={{debug}}
#设置日志记录水平
loglevel='{{loglevel}}'
#监听内网端口
bind='{{bind}}'
#并行工作进程数
workers={{workers}}
#指定每个工作者的线程数
threads={{threads}}
#工作模式协程
worker_class='{{worker_class}}'
forwarded_allow_ips='{{forwarded_allow_ips}}'
x_forwarded_for_header='{{x_forwarded_for_header}}'
#设置守护进程,将进程交给supervisor管理
daemon={{daemon}}
#超时时间
timeout={{timeout}}
#设置最大并发量
worker_connections={{worker_connections}}
#设置进程文件目录
pidfile='{{pidfile}}'
#设置访问日志和错误信息日志路径
accesslog='{{accesslog}}'
errorlog='{{errorlog}}'
